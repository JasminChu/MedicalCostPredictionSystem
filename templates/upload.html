<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Dataset</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📂 Upload Training Data</h1>
            <p class="subtitle">Upload your CSV file containing records and charges to update your model.</p>
        </header>

        <form action="/upload" method="POST" enctype="multipart/form-data" class="upload-form">
            <div style="margin-bottom: 20px;">
                <input type="file" name="file" accept=".csv" required style="padding: 10px;">
            </div>
            <button type="submit" class="btn btn-primary">Upload CSV</button>
        </form>

        {% if message %}
            <div style="margin-top: 20px; padding: 15px; background-color: #edf2f7; border-radius: 8px;">
                <p style="font-weight: bold; color: #2b6cb0;">{{ message }}</p>
            </div>
        {% endif %}

        <div style="margin-top: 20px;">
            <a href="/" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
